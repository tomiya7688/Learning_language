name: Rust curriculum CI

on:
  pull_request:
    paths:
      - "教材/Rust/**"
      - "tests/test_rust_curriculum.py"
      - ".github/workflows/rust-ci.yml"
  push:
    branches: [main]
    paths:
      - "教材/Rust/**"
      - "tests/test_rust_curriculum.py"
      - ".github/workflows/rust-ci.yml"

jobs:
  examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 教材/Rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Compile all examples
        run: cargo check --all-targets --offline
      - name: Run Rust unit tests
        run: cargo test --all-targets --offline
      - name: Check lesson links and files
        working-directory: .
        run: python3 -m unittest discover -s tests -p test_rust_curriculum.py -v
