name: "タスク・不具合・改善"
description: "開発タスク、バグ、文書、設計、調査を共通の形式で起票します"
title: ""
body:
  - type: markdown
    attributes:
      value: |
        このリポジトリの優先度は **P0〜P8** です。
        P0は重大事故専用、P1〜P3はPython教材と関連する共通作業、P4〜P8は他言語の教材に使います。
        他リポジトリ共通のP0〜P4（高・通常・低・保留）とは異なります。
        具体的な割当ては「資料/Issue優先度運用.md」を正本としてください。
  - type: dropdown
    id: issue_type
    attributes:
      label: 種別
      options:
        - "バグ"
        - "機能追加"
        - "改善・リファクタリング"
        - "テスト・CI"
        - "ドキュメント"
        - "設計・調査"
        - "その他"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: "Learning_languageのP0〜P8から選択。Python以外の通常作業はP4以降。詳細は資料/Issue優先度運用.md"
      options:
        - "P0：緊急（教材の重大破損、公開・ライセンス事故）"
        - "P1：Python教材の基盤・優先共通作業"
        - "P2：Python教材の通常作業"
        - "P3：Python教材の応用・上級・将来作業"
        - "P4：Pythonの次に着手する他言語（例：DNCL、Scratch）"
        - "P5：続いて着手する他言語（例：Rust、Zig、Fortran）"
        - "P6：その後の他言語（例：C、Go、C++、Common Lisp）"
        - "P7：さらに後で扱う他言語（例：Java、C#、SQL）"
        - "P8：将来対応の他言語（例：Simula、Smalltalk、Bend）"
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 目的・現状の問題
      description: "何を解決・実現するか、今の状態と必要性を具体的に記載してください"
      placeholder: "現状／困っていること／このIssueで目指す状態"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 対応内容・対象範囲
      description: "変更予定の機能や文書、守るべき制約。必要なら対象外も記載してください"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: "終わったと判断できる条件を書いてください"
      placeholder: |
        - [ ] 条件1
        - [ ] 条件2
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 検証・再現手順
      description: "バグなら再現手順・期待結果、実装ならテスト方法、調査なら確認方法を記載してください"
    validations:
      required: false
  - type: textarea
    id: urgency
    attributes:
      label: 優先度の根拠（P0の場合は必須）
      description: "P0なら影響範囲と、なぜ今すぐ対応しなければならないかを具体的に書いてください"
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 関連Issue・PR・仕様
      description: "必要なリンクや先行作業があれば記載してください"
    validations:
      required: false
