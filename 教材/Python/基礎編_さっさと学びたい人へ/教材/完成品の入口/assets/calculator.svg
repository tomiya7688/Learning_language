<svg xmlns="http://www.w3.org/2000/svg" width="420" height="520" viewBox="0 0 420 520" role="img" aria-labelledby="title desc">
  <title id="title">sinとcosを使える関数電卓の画面構成</title>
  <desc id="desc">関数電卓の画面構成：上から数字と角度の入力欄、計算式、答え。下は4列の盤面で、sin・cos・C・/、7・8・9・*、4・5・6・-、1・2・3・+、0・小数点・横2列の=ボタン。公開コードに基づく図で、実行画面の撮影ではありません。</desc>
  <g font-family="sans-serif">
    <rect width="420" height="520" fill="#f1f1f1"/><rect width="420" height="36" fill="#ddd"/>
    <text x="18" y="25" font-size="18">関数電卓</text>
    <text x="210" y="62" text-anchor="middle" font-size="16">数字（sin・cosは角度を度で入力）</text>
    <rect x="16" y="74" width="388" height="30" fill="white" stroke="#888"/>
    <text x="24" y="96" font-size="18">1.0</text>
    <text x="210" y="132" text-anchor="middle" font-size="17">計算式: cos(0.0°) = 1.0</text>
    <text x="210" y="160" text-anchor="middle" font-size="18">答え: 1.0</text>
    <rect x="16" y="180" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="61" y="216" text-anchor="middle" font-size="22">sin</text>
    <rect x="114" y="180" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="159" y="216" text-anchor="middle" font-size="22">cos</text>
    <rect x="212" y="180" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="257" y="216" text-anchor="middle" font-size="22">C</text>
    <rect x="310" y="180" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="355" y="216" text-anchor="middle" font-size="22">/</text>
    <rect x="16" y="244" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="61" y="280" text-anchor="middle" font-size="22">7</text>
    <rect x="114" y="244" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="159" y="280" text-anchor="middle" font-size="22">8</text>
    <rect x="212" y="244" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="257" y="280" text-anchor="middle" font-size="22">9</text>
    <rect x="310" y="244" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="355" y="280" text-anchor="middle" font-size="22">*</text>
    <rect x="16" y="308" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="61" y="344" text-anchor="middle" font-size="22">4</text>
    <rect x="114" y="308" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="159" y="344" text-anchor="middle" font-size="22">5</text>
    <rect x="212" y="308" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="257" y="344" text-anchor="middle" font-size="22">6</text>
    <rect x="310" y="308" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="355" y="344" text-anchor="middle" font-size="22">-</text>
    <rect x="16" y="372" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="61" y="408" text-anchor="middle" font-size="22">1</text>
    <rect x="114" y="372" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="159" y="408" text-anchor="middle" font-size="22">2</text>
    <rect x="212" y="372" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="257" y="408" text-anchor="middle" font-size="22">3</text>
    <rect x="310" y="372" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="355" y="408" text-anchor="middle" font-size="22">+</text>
    <rect x="16" y="436" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="61" y="472" text-anchor="middle" font-size="22">0</text>
    <rect x="114" y="436" width="90" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="159" y="472" text-anchor="middle" font-size="22">.</text>
    <rect x="212" y="436" width="188" height="56" rx="3" fill="#e4e4e4" stroke="#888"/><text x="306" y="472" text-anchor="middle" font-size="22">=</text>
  </g>
</svg>
