<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Pg5の初期設定：640×480のゲーム画面、自機の中心と左上、3機の敵</title>
  <desc id="desc">ゲーム画面の左上は横0・縦0。横xは右へ、縦yは下へ増える。幅640、高さ480ピクセル。自機の中心は320,400、位置を管理する40×40の長方形の左上は300,380。敵の中心は160,80、320,40、480,100。位置を更新する前の説明図で、実行画面の撮影ではない。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1e40af"/></marker>
  </defs>
  <rect width="900" height="760" fill="#fff"/>
  <g font-family="Meiryo, Yu Gothic, sans-serif" fill="#172033" font-size="24">
    <text x="32" y="38" font-size="28" font-weight="bold">ゲーム画面の位置を、左上から数える</text>
    <text x="32" y="72" font-size="22">位置の更新前の説明図（実行画面の撮影ではありません）</text>
    <path d="M135 108 H775" fill="none" stroke="#1e40af" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="330" y="100" fill="#1e40af">横 x：右へ増える</text>
    <text x="140" y="129" font-size="20">左上 (0, 0)</text>
    <path d="M100 135 V615" fill="none" stroke="#1e40af" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="72" y="415" fill="#1e40af" transform="rotate(-90 72 415)">縦 y：下へ増える</text>
    <rect x="135" y="135" width="640" height="480" fill="#0a0a1e" stroke="#172033" stroke-width="2"/>
    <g transform="translate(135 135)">
      <path d="M320 0 V480 M0 240 H640" stroke="#5c6070" stroke-dasharray="6 6"/>
      <rect x="140" y="60" width="40" height="40" fill="#ff6464"/>
      <rect x="300" y="20" width="40" height="40" fill="#ff6464"/>
      <rect x="460" y="80" width="40" height="40" fill="#ff6464"/>
      <g fill="#fff" font-size="22">
        <text x="55" y="138">敵の中心 (160, 80)</text>
        <text x="343" y="42">(320, 40)</text>
        <text x="395" y="156">(480, 100)</text>
        <text x="15" y="231">画面の中央：縦240</text>
      </g>
      <rect x="300" y="380" width="40" height="40" fill="none" stroke="#fff" stroke-dasharray="4 3" stroke-width="2"/>
      <polygon points="320,380 300,420 340,420" fill="#64c8ff"/>
      <circle cx="320" cy="400" r="5" fill="#fde047"/>
      <path d="M320 400 H390" stroke="#fde047" stroke-width="2"/>
      <text x="402" y="408" fill="#fde047" font-size="22">自機の中心</text>
      <text x="402" y="438" fill="#fde047" font-size="22">(320, 400)</text>
      <path d="M300 380 H190" stroke="#fff" stroke-width="2"/>
      <text x="30" y="352" fill="#fff" font-size="22">自機の長方形の左上</text>
      <text x="80" y="383" fill="#fff" font-size="22">(300, 380)</text>
    </g>
    <text x="135" y="647">0</text><text x="742" y="647">640</text>
    <text x="780" y="153">0</text><text x="780" y="615">480</text>
    <text x="275" y="685">横幅640・縦幅480ピクセル</text>
    <text x="32" y="720" font-size="22">白い点線の40×40は自機の位置を管理する長方形です。</text>
    <text x="32" y="750" font-size="22">実際に自機として描くのは水色の三角形です。</text>
  </g>
</svg>
