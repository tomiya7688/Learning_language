<svg xmlns="http://www.w3.org/2000/svg" width="500" height="850" viewBox="0 0 500 850" role="img" aria-labelledby="title desc">
<title id="title">自機弾と敵の長方形が離れる・接する・重なる3例</title>
<desc id="desc">敵は左100上100幅40高さ40、自機弾は左117幅6高さ20。弾の上端150なら離れてFalse、140なら辺の接触でFalse、135なら縦5ピクセル重なりTrue。ゲーム座標は左上が0,0で右と下が正。各図は3倍の説明図で実行画面ではない。</desc>
<rect width="500" height="850" fill="#fff"/>
<g font-family="sans-serif" font-size="17" fill="#172033">
<text x="20" y="28">命中判定の説明図（実行画面ではありません）</text>
<text x="20" y="54">ゲームの左上が (0, 0)。右へx増加、下へy増加。</text>
<text x="20" y="80">赤：敵40×40　黄：自機弾6×20（図は3倍）</text>
<text x="20" y="120">1. 離れている → False：命中しない</text>
<rect x="55" y="140" width="120" height="120" fill="#ff6464"/>
<rect x="106" y="290" width="18" height="60" fill="#fff064"/>
<text x="210" y="165">敵の左上 (100, 100)</text>
<text x="210" y="195">敵の下端 y = 140</text>
<text x="210" y="225">弾の左端 x = 117</text>
<text x="210" y="255">弾の上端 y = 150</text>
<text x="20" y="360">2. 辺が接している → False：命中しない</text>
<rect x="55" y="380" width="120" height="120" fill="#ff6464"/>
<rect x="106" y="500" width="18" height="60" fill="#fff064"/>
<text x="210" y="405">敵の左上 (100, 100)</text>
<text x="210" y="435">敵の下端 y = 140</text>
<text x="210" y="465">弾の左端 x = 117</text>
<text x="210" y="495">弾の上端 y = 140</text>
<text x="20" y="600">3. 内側が重なっている → True：命中する</text>
<rect x="55" y="620" width="120" height="120" fill="#ff6464"/>
<rect x="106" y="725" width="18" height="60" fill="#fff064"/>
<text x="210" y="645">敵の左上 (100, 100)</text>
<text x="210" y="675">敵の下端 y = 140</text>
<text x="210" y="705">弾の左端 x = 117</text>
<text x="210" y="735">弾の上端 y = 135</text>
<rect x="106" y="725" width="18" height="15" fill="none" stroke="#1740aa" stroke-width="2"/>
<text x="210" y="765">青枠：重なる部分6×5</text>
<text x="20" y="830">青枠は説明用。ゲームには描きません。</text>
</g></svg>
