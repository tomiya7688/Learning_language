<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">自機の初期位置と三角形に使う3点</title>
  <desc id="desc">中心は320,400。位置管理用の長方形の左上は300,380で幅と高さは40。三角形は上辺の中央320,380、左下300,420、右下340,420を結ぶ。破線の長方形と赤い中心点は説明用でゲームには描かない。図は4倍に拡大している。</desc>
  <rect width="760" height="390" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="17" fill="#172033">
    <text x="30" y="30">自機の初期位置を拡大した説明図（座標の単位：ピクセル）</text>
    <polygon points="340,90 260,250 420,250" fill="rgb(100,200,255)" stroke="#167ca8" stroke-width="2"/>
    <rect x="260" y="90" width="160" height="160" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
    <circle cx="340" cy="170" r="4" fill="#dc2626"/>
    <g stroke="#64748b" stroke-width="1.5" fill="none">
      <path d="M260 90 L180 90"/>
      <path d="M340 90 L340 70"/>
      <path d="M345 170 L490 170"/>
      <path d="M260 250 L200 290 L60 290"/>
      <path d="M420 250 L480 290 L690 290"/>
    </g>
    <text x="30" y="82">長方形の左上</text>
    <text x="30" y="105">(300, 380)</text>
    <text x="340" y="61" text-anchor="middle">midtop (320, 380)</text>
    <text x="500" y="164">中心 center</text>
    <text x="500" y="187">(320, 400)</text>
    <text x="40" y="315">bottomleft (300, 420)</text>
    <text x="455" y="315">bottomright (340, 420)</text>
    <text x="30" y="350">破線の長方形と赤い中心点は説明用で、ゲームには描きません。</text>
    <text x="30" y="375">長方形の幅40・高さ40を、図では4倍に拡大しています。</text>
  </g>
</svg>
