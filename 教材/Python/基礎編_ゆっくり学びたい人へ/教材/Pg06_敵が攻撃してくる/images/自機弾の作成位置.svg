<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 670" role="img" aria-labelledby="title desc">
  <title id="title">自機の初期位置から弾を作った直後の位置</title>
  <desc id="desc">画面の幅は640、高さは480ピクセル。左上0,0から横は右、縦は下へ増える。初期位置の自機の中心は320,400、上端は380。作成した弾の中心は320,380、左上は317,370、幅6、高さ20、下端390。弾の中心が自機の上端なので弾の下半分は自機の長方形と重なる。上の図は4倍、下の画面全体は4分の1。図は移動前の説明で、実行画面ではない。</desc>
  <rect width="760" height="670" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="17" fill="#172033">
    <text x="30" y="30">弾を作った直後（移動・描画より前）の位置</text>
    <text x="30" y="55">自機の初期位置を使う例です。座標の単位はピクセルです。</text>
    <polygon points="340,180 260,340 420,340" fill="rgb(100,200,255)"/>
    <rect x="260" y="180" width="160" height="160" fill="none" stroke="#64748b" stroke-dasharray="7 5"/>
    <rect x="328" y="140" width="24" height="80" fill="rgb(255,240,100)"/>
    <circle cx="340" cy="180" r="4" fill="#dc2626"/>
    <circle cx="340" cy="260" r="4" fill="#dc2626"/>
    <g stroke="#64748b" stroke-width="1.5" fill="none">
      <path d="M352 140 L430 125"/>
      <path d="M345 180 L430 185"/>
      <path d="M352 220 L430 235"/>
      <path d="M345 260 L430 275"/>
      <path d="M260 180 L190 180"/>
    </g>
    <text x="440" y="125">弾の左上 (317, 370)</text>
    <text x="440" y="185">弾の中心 (320, 380)</text>
    <text x="440" y="238">弾の下端の位置は390</text>
    <text x="440" y="278">自機の中心 (320, 400)</text>
    <text x="30" y="174">自機の上端の位置は380</text>
    <text x="30" y="370">弾の幅6・高さ20、自機の幅40・高さ40を4倍に拡大しています。</text>
    <text x="30" y="395">破線の長方形と赤い点は説明用で、ゲームには描きません。</text>
    <text x="30" y="425">画面全体：幅640 × 高さ480ピクセル（下の小図は4分の1）</text>
    <rect x="50" y="460" width="160" height="120" fill="#0a0a1e" stroke="#64748b"/>
    <polygon points="130,555 125,565 135,565" fill="rgb(100,200,255)"/>
    <rect x="129.25" y="552.5" width="1.5" height="5" fill="rgb(255,240,100)"/>
    <rect x="122" y="549" width="16" height="20" fill="none" stroke="#dc2626" stroke-dasharray="3 2"/>
    <g stroke="#64748b" stroke-width="1.5" fill="none">
      <path d="M50 460 L235 460 M227 455 L235 460 L227 465"/>
      <path d="M50 460 L50 605 M45 597 L50 605 L55 597"/>
      <path d="M140 557 L245 520"/>
    </g>
    <text x="30" y="450">左上 (0, 0)</text>
    <text x="245" y="465">横の位置xは右へ増えます →</text>
    <text x="60" y="600">画面の下端の位置は480</text>
    <text x="30" y="630">縦の位置yは下へ増えます ↓</text>
    <text x="255" y="520">赤い枠内の自機と弾を上の図で拡大しています。</text>
    <text x="255" y="545">小図の赤い枠も説明用です。</text>
    <text x="30" y="660">作成後の最初の更新で弾は上へ8ピクセル動きます。</text>
  </g>
</svg>
